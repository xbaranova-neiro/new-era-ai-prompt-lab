 {before:'Это распределённая инфраструктура удалённого хранения с виртуализацией ресурсов и синхронизацией данных.',problems:['Слишком много непонятных терминов','В ответе слишком мало терминов','Нужно перечислить больше сервисов'],problem:0,reason:'Для первого знакомства слова «виртуализация» и «инфраструктура» требуют ещё одного объяснения.',fixes:['Расскажи профессионально и очень подробно','Объясни простыми словами для новичка','Перечисли технические названия функций'],fix:1,why:'Если указать свой уровень, проще получить объяснение, с которого можно начать.',instruction:'Объясни простыми словами для новичка, без специальных терминов.',after:'Облачное хранилище — это место для файлов на компьютерах сервиса. К ним можно получить доступ через интернет.',takeaway:'Скажи ИИ, что ты уже знаешь о теме.'},
 {before:'Облачное хранилище — это место для файлов на компьютерах сервиса. К ним можно получить доступ через интернет.',problems:['Нужно сделать объяснение более серьёзным','Нужно вернуть технические определения','Не хватает знакомого примера с фото'],problem:2,reason:'В нашей задаче нужен пример с фотографиями — он связывает новую тему с привычным действием.',fixes:['Покажи один пример с фото на телефоне','Добавь много фактов из истории интернета','Перепиши объяснение в официальном стиле'],fix:0,why:'Знакомый пример показывает, как понятие работает на практике.',instruction:'Добавь один пример с фотографиями на телефоне.',after:'Облачное хранилище — это место для файлов на компьютерах сервиса. Например, ты загрузила туда фото с телефона, а потом открыла его на ноутбуке через интернет, войдя в тот же аккаунт.',takeaway:'Попроси пример из знакомой тебе ситуации.'}],
 fields:[['В какой теме хочешь разобраться?','Назови понятие или задай короткий вопрос.',['Что такое облачное хранилище','Как работает нейросеть']],['Что ты уже знаешь об этом?','Нормально начать с нуля.',['Ничего, слышу впервые','Знаю основы, но путаюсь в деталях']],['Какой пример тебе будет понятен?','Выбери знакомую ситуацию или напиши свою.',['Фото на телефоне','Покупки в магазине','Задачи на работе']]],
 prompt:v=>`Объясни тему: ${v[0]}.\nМой уровень: ${v[1]}.\nИспользуй пример из ситуации: ${v[2]}.\nСначала дай простое объяснение в 2–3 предложениях, затем один пример и короткий вывод. Каждый необходимый термин объясняй обычными словами.`,check:'Ты можешь пересказать объяснение своими словами, а пример помогает понять тему.'}
};
const KEY='new-era-prompt-lab-v7';
// Awaiting the course owner's real zero-application URL. Never substitute email.
const APPLICATION_URL='';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({round:0,phase:'problem',problem:null,fix:null,field:0,values:['','',''],review:''});
let state={stage:0,scene:'',records:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved}}catch{}
if(![0,1,2,3].includes(state.stage))state.stage=0;
if(!Object.hasOwn(scenes,state.scene)){state.scene='';state.stage=0}
if(!state.records||typeof state.records!=='object')state.records={};
for(const id of Object.keys(scenes)){
 const saved=state.records[id],r={...blank(),...(saved&&typeof saved==='object'?saved:{})};
 if(!Number.isInteger(r.round)||r.round<0||r.round>2)Object.assign(r,blank());
 if(!['problem','fix','result'].includes(r.phase))r.phase='problem';
 if(![null,0,1,2].includes(r.problem))r.problem=null;
 if(![null,0,1,2].includes(r.fix))r.fix=null;
 if(r.problem===null)r.phase='problem';
 if(r.phase==='result'&&r.fix===null)r.phase='fix';
 if(!Number.isInteger(r.field)||r.field<0||r.field>2)r.field=0;
 r.values=Array.from({length:3},(_,i)=>typeof r.values?.[i]==='string'?r.values[i].slice(0,800):'');
 if(!['','ok','vague','hard','facts'].includes(r.review))r.review='';
 state.records[id]=r;
}
const current=()=>state.records[state.scene];
const scene=()=>scenes[state.scene];
const allFields=()=>current().values.every(v=>v.trim());
if(state.stage>1&&current().round<2)state.stage=1;
if(state.stage===3&&!allFields())state.stage=2;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const toast=msg=>{$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3000)};
const prompt=()=>scene().prompt(current().values.map(v=>v.trim()))+'\nНе выдумывай недостающие факты. Если для ответа нужны дополнительные данные, сначала задай мне короткий вопрос.';
const corrections={vague:'Сделай ответ конкретнее: убери общие фразы, добавь понятный пример или действие. Сохрани задачу и ограничения из моего запроса.',hard:'Перепиши проще и короче. Используй обычные слова. Каждый необходимый термин объясни сразу.',facts:'Проверь, какие факты ты добавил без моих данных. Убери неподтверждённые утверждения. Если без них нельзя ответить, задай мне вопрос.'};
const button=(id,text,secondary=false)=>`<button type="button" id="${id}" class="${secondary?'flow-secondary':'flow-primary'}">${text}</button>`;
const instruction=(title,text)=>`<div class="flow-instruction"><b>${title}</b><p>${text}</p></div>`;
const bubble=(label,text,type='')=>`<div class="flow-bubble ${type}"><span>${label}</span><p>${esc(text)}</p></div>`;
const shell=(title,lead,body)=>`<div class="flow-eyebrow">${state.stage===0?'Домашняя практика':esc(scene().title)+' · '+['','учебный пример','твоя задача','твой запрос'][state.stage]}</div><h2 tabindex="-1">${title}</h2><p class="flow-lead">${lead}</p>${body}`;
const feedback=(correct,title,text)=>`<div class="flow-feedback ${correct?'good':''}" role="status"><b>${title}</b><p>${esc(text)}</p></div>`;
const choices=(type,items,selected,correct)=>`<div class="flow-choices">${items.map((text,i)=>`<button type="button" data-${type}="${i}" class="flow-choice ${selected===i?'chosen':''} ${selected!==null&&i===correct?'right':''}" ${selected!==null?'disabled':''}><span class="choice-letter">${'АБВ'[i]}</span><span>${esc(text)}${selected!==null&&i===correct?'<small>✓ Подходит к нашей задаче</small>':''}${selected===i&&i!==correct?'<small>Твой выбор</small>':''}</span></button>`).join('')}</div>`;
function chooseScreen(){return shell('Что тебе нужно сделать?','Выбери одну задачу. Сначала разберём короткий пример, потом подготовим запрос для тебя.',`<div class="scenario-grid">${Object.entries(scenes).map(([id,s])=>`<button type="button" class="scenario-card ${state.scene===id?'selected':''}" data-scene="${id}" aria-pressed="${state.scene===id}"><span class="scenario-icon">${s.icon}</span><strong>${s.title}</strong><span>${s.desc}</span></button>`).join('')}</div><div class="flow-actions">${button('start',state.scene?(current().round>0||current().problem!==null?'Продолжить эту задачу →':'Начать с примера →'):'Выбери задачу выше')}${button('default-example','Нет своей задачи — взять пример',true)}</div><p class="flow-hint" id="choose-help">${state.scene?'Выбрано: '+esc(scene().title)+'. Нажми синюю кнопку.':'Просто нажми на одну из четырёх карточек.'}</p><p class="flow-hint">Запрос — это сообщение, которое ты отправляешь ИИ.</p><div class="flow-roadmap"><span><b>1</b> Выберешь задачу</span><span><b>2</b> Потренируешься на примере</span><span><b>3</b> Получишь свой запрос</span></div>`)}
function lessonScreen(){const s=scene(),r=current(),q=s.rounds[r.round];
 if(!q){state.stage=2;return ownScreen()}
 const context=`<div class="flow-case"><b>Наша задача</b><p>${esc(s.goal)}</p></div>`;
 if(r.phase==='problem')return shell('Что не так с ответом?','Прочитай задачу и короткий ответ. Выбери одну проблему.',`<div class="round-count">Уточнение ${r.round+1} из 2</div>${context}${bubble('Ты отправляешь ИИ', [s.weak,...s.rounds.slice(0,r.round).map(x=>x.instruction)].join(' '))}${bubble('Пример ответа ИИ',q.before)}${choices('problem',q.problems,r.problem,q.problem)}${r.problem!==null?feedback(r.problem===q.problem,r.problem===q.problem?'Да, это мешает решить задачу.':'Посмотри на отмеченную проблему.',q.reason)+button('to-fix','Как это исправить? →'):'<p class="flow-hint">Нажми на один из трёх вариантов. Ошибиться можно — сразу объясним.</p>'}`);
 if(r.phase==='fix')return shell('Что добавить в запрос?','Выбери фразу, которая исправит найденную проблему.',`<div class="round-count">Уточнение ${r.round+1} из 2</div>${instruction('Проблема',esc(q.problems[q.problem]))}${choices('fix',q.fixes,r.fix,q.fix)}${r.fix!==null?feedback(r.fix===q.fix,r.fix===q.fix?'Это уточнение подходит.':'Попробуем уточнение, которое решает проблему.',q.why)+bubble('В запрос добавится эта фраза',q.instruction,'accent')+button('apply-fix',r.fix===q.fix?'Добавить и посмотреть результат →':'Применить подсказку и посмотреть →'):'<p class="flow-hint">Длиннее не значит лучше. Выбирай по смыслу.</p>'}${button('lesson-back','← Ещё раз посмотреть ответ',true)}`);
 return shell('Вот что изменилось','Сравни два коротких текста: мы добавили конкретную подсказку.',`<div class="round-count">Уточнение ${r.round+1} из 2</div><div class="flow-comparison">${bubble('Было',q.before)}${bubble('Стало',q.after,'accent')}</div>${feedback(true,'Запомни',q.takeaway)}${button('round-next',r.round===0?'Попробовать ещё одно уточнение →':'Теперь сделать для себя →')}<details class="flow-details"><summary>Посмотреть учебный запрос целиком</summary><p>${esc([s.weak,...s.rounds.slice(0,r.round+1).map(x=>x.instruction)].join('\n'))}</p></details><p class="flow-disclosure">Это заранее подготовленные учебные примеры. Настоящий ответ ИИ может отличаться.</p>`)
}
function ownScreen(){const s=scene(),r=current(),f=s.fields[r.field];return shell(f[0],r.field===0?'На примере ты увидела, как уточнения помогают. Теперь соберём такой запрос для тебя.':f[1],`<div class="round-count">Твоя задача: ${esc(s.title.toLowerCase())} · вопрос ${r.field+1} из 3</div>${instruction('Что сделать сейчас',r.field===0?f[1]:'Нажми на готовый ответ или напиши свой.')}<label class="field-label" for="own-answer">Твой ответ</label><textarea class="flow-input" id="own-answer" rows="3" maxlength="800" placeholder="${esc(f[2][0])}" aria-describedby="own-help">${esc(r.values[r.field])}</textarea><div class="example-label">Можно нажать на пример — он подставится в поле</div><div class="flow-examples">${f[2].map((x,i)=>`<button type="button" data-example="${i}">${esc(x)}</button>`).join('')}</div><p id="own-help" class="flow-hint">Можно изменить подставленный текст. Большое сочинение не нужно.</p><div class="flow-actions">${button('field-next',r.field===2?'Собрать мой запрос →':'Сохранить и дальше →')}${button('field-back',r.field===0?'← Вернуться к примеру':'← Предыдущий вопрос',true)}</div><details class="flow-details"><summary>Что уже выбрано</summary><dl><dt>Задача</dt><dd>${esc(s.title)}</dd>${s.fields.slice(0,r.field).map((f,i)=>`<dt>${esc(f[0])}</dt><dd>${esc(r.values[i])}</dd>`).join('')}</dl></details>`)}
function finalScreen(){const r=current();return shell('Запрос собран. Попробуй его в ИИ.','Осталось скопировать текст и отправить его в тот ИИ-чат, которым ты пользуешься.',`<div class="flow-final"><span class="example-label">Запрос для твоей задачи</span><div id="result" class="flow-prompt">${esc(prompt())}</div></div><div class="flow-actions">${button('copy','1. Скопировать запрос')}<a class="flow-secondary" href="https://chatgpt.com/" target="_blank" rel="noopener">2. Открыть ChatGPT ↗</a></div><p class="flow-hint">Подойдёт и другой ИИ-чат. Вставь скопированный текст в поле сообщения и нажми «Отправить».</p><div class="flow-check"><h3>3. Посмотри на полученный ответ</h3><p>${esc(scene().check)}</p><p>Отдельно проверь факты. Если ИИ задаёт вопрос, ответь тем, что знаешь; неизвестные данные придумывать не нужно.</p><span class="example-label">Когда получишь ответ, выбери подходящий вариант</span><div class="flow-examples">${[['ok','Мне подходит'],['vague','Слишком общо'],['hard','Сложно написано'],['facts','Придуманы факты']].map(([id,title])=>`<button type="button" data-review="${id}" aria-pressed="${r.review===id}" class="${r.review===id?'selected':''}">${title}</button>`).join('')}</div>${r.review==='ok'?feedback(true,'Практика завершена','Ты выбрала задачу, уточнила запрос и проверила результат. Эти же шаги можно повторять с другими задачами.'):r.review?bubble('Скопируй уточнение и отправь в тот же чат',corrections[r.review],'accent')+button('copy-correction','Скопировать уточнение'):''}</div><div class="flow-actions">${button('edit-own','Изменить мой запрос',true)}${button('another-scene','Попробовать другую задачу',true)}</div>${/^https:\/\//.test(APPLICATION_URL)?`<div class="application-card"><h3>Хочешь применять ИИ в своей работе?</h3><p>Узнай о программе курса и условиях участия.</p><a class="application-btn" href="${esc(APPLICATION_URL)}" target="_blank" rel="noopener">Оставить заявку →</a></div>`:''}`)}
function render(){const r=state.scene?current():null;document.body.classList.toggle('in-practice',state.stage>0);$('track').innerHTML=['Выбрать задачу','Попробовать на примере','Сделать для себя'].map((x,i)=>`<button type="button" data-nav="${i}" class="step-nav ${Math.min(state.stage,2)===i?'active':''}" ${i===1&&!r||i===2&&(!r||r.round<2)?'disabled':''} ${Math.min(state.stage,2)===i?'aria-current="step"':''}><span class="num">${i+1}</span><strong>${x}</strong></button>`).join('');$('content').innerHTML=[chooseScreen,lessonScreen,ownScreen,finalScreen][state.stage]();$('progress-fill').style.width=`${state.stage===0?0:state.stage===1?15+r.round*20:state.stage===2?60+r.field*10:100}%`;bind()}
function moveFocus(){$('content').querySelector('h2')?.focus({preventScroll:true});$('main').scrollIntoView({behavior:'auto',block:'start'})}
const update=(focus=true)=>{save();render();if(focus)moveFocus()};
function start(){if(!state.scene){$('choose-help').textContent='Сначала выбери карточку задачи — например, «Написать пост».';document.querySelector('[data-scene]')?.focus();return}state.stage=current().round>=2?2:1;update()}
function fieldNext(){const r=current();if(!r.values[r.field].trim()){$('own-help').textContent='Напиши короткий ответ или нажми на один из примеров под полем.';$('own-help').setAttribute('role','alert');$('own-answer').focus();return}r.values[r.field]=r.values[r.field].trim();if(r.field<2)r.field++;else{const missing=r.values.findIndex(v=>!v.trim());if(missing>=0){r.field=missing;}else state.stage=3;}update()}
async function copy(text,id){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch{}t.remove()}if(ok){if($(id))$(id).textContent='✓ Скопировано';toast('Скопировано. Теперь вставь текст в свой ИИ-чат.')}else toast('Выдели текст запроса и скопируй вручную — кнопка не смогла получить доступ к буферу.')}
function bind(){const on=(id,fn)=>{if($(id))$(id).onclick=fn};
 document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=b.dataset.scene;update(false);$('start').focus({preventScroll:true})});
 on('start',start);on('default-example',()=>{state.scene='post';start()});
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.nav);if(n>0&&!state.scene||n===2&&current().round<2)return;if(n===1&&current().round===2){current().round=1;current().phase='result';current().problem=scene().rounds[1].problem;current().fix=scene().rounds[1].fix;}state.stage=n;update()});
 document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{const r=current();if(r.problem!==null)return;r.problem=Number(b.dataset.problem);update(false);$('to-fix').scrollIntoView({block:'nearest'});$('to-fix').focus({preventScroll:true})});
 on('to-fix',()=>{if(current().problem===null)return;current().phase='fix';update()});
 document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const r=current();if(r.fix!==null)return;r.fix=Number(b.dataset.fix);update(false);$('apply-fix').scrollIntoView({block:'nearest'});$('apply-fix').focus({preventScroll:true})});
 on('lesson-back',()=>{current().phase='problem';update()});on('apply-fix',()=>{if(current().fix===null)return;current().phase='result';update()});
 on('round-next',()=>{const r=current();if(r.phase!=='result'||r.round>=2)return;r.round++;r.phase='problem';r.problem=null;r.fix=null;if(r.round>=2)state.stage=2;update()});
 $('own-answer')?.addEventListener('input',e=>{current().values[current().field]=e.target.value;current().review='';save();$('own-help').textContent='Готово? Нажми синюю кнопку под примерами.'});
 document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{const r=current();r.values[r.field]=scene().fields[r.field][2][Number(b.dataset.example)];r.review='';update(false);$('field-next').focus({preventScroll:true})});
 on('field-next',fieldNext);on('field-back',()=>{const r=current();if(r.field>0)r.field--;else{state.stage=1;r.round=1;r.phase='result';r.problem=scene().rounds[1].problem;r.fix=scene().rounds[1].fix;}update()});
 on('copy',()=>copy(prompt(),'copy'));on('edit-own',()=>{current().field=0;state.stage=2;update()});on('another-scene',()=>{state.stage=0;update()});
 document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{current().review=b.dataset.review;update(false)});on('copy-correction',()=>copy(corrections[current().review],'copy-correction'));
}
save();render();

})();</script></body></html>
