const KEY='new-era-prompt-lab-v8';
// Set the real course forms here. Empty URLs never render inactive links.
const HOMEWORK_URL='';
const APPLICATION_WIDGET={id:'4099aa808712c0677549aeb9448b79c112cdf393',src:'https://xeniabaranova-school.ru/pl/lite/widget/script?id=1656472'};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({round:0,phase:'problem',problem:null,fix:null,field:0,values:['','',''],review:''});
let state={stage:0,scene:'',records:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&typeof saved==='object')state={...state,...saved}}catch{}
if(![0,1,2,3].includes(state.stage))state.stage=0;
if(!Object.hasOwn(scenes,state.scene)){state.scene='';state.stage=0}
if(!state.records||typeof state.records!=='object')state.records={};
for(const id of Object.keys(scenes)){
 const saved=state.records[id],r={...blank(),...(saved&&typeof saved==='object'?saved:{})};
 if(!Number.isInteger(r.round)||r.round<0||r.round>2)Object.assign(r,blank());
 if(!['problem','fix','result'].includes(r.phase))r.phase='problem';
 if(![null,0,1,2].includes(r.problem))r.problem=null;
 if(![null,0,1,2].includes(r.fix))r.fix=null;
 if(r.problem===null)r.phase='problem';
 if(r.phase==='result'&&r.fix===null)r.phase='fix';
 if(!Number.isInteger(r.field)||r.field<0||r.field>2)r.field=0;
 r.values=Array.from({length:3},(_,i)=>typeof r.values?.[i]==='string'?r.values[i].slice(0,800):'');
 if(!['','ok','vague','hard','facts'].includes(r.review))r.review='';
 state.records[id]=r;
}
const current=()=>state.records[state.scene];
const scene=()=>scenes[state.scene];
const allFields=()=>current().values.every(v=>v.trim());
if(state.stage>1&&current().round<2)state.stage=1;
if(state.stage===3&&!allFields())state.stage=2;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const toast=msg=>{$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),3000)};
const prompt=()=>scene().prompt(current().values.map(v=>v.trim()))+'\nНе выдумывай недостающие факты. Если для ответа нужны дополнительные данные, сначала задай мне короткий вопрос.';
const button=(id,text,secondary=false)=>`<button type="button" id="${id}" class="${secondary?'flow-secondary':'flow-primary'}">${text}</button>`;
const instruction=(title,text)=>`<div class="flow-instruction"><b>${title}</b><p>${text}</p></div>`;
const bubble=(label,text,type='')=>`<div class="flow-bubble ${type}"><span>${label}</span><p>${esc(text)}</p></div>`;
const shell=(title,lead,body)=>`<div class="flow-eyebrow">${state.stage===0?'Домашняя практика':esc(scene().title)+' · '+['','учебный пример','твоя задача','готово'][state.stage]}</div><h2 tabindex="-1">${title}</h2><p class="flow-lead">${lead}</p>${body}`;
const feedback=(correct,title,text)=>`<div class="flow-feedback ${correct?'good':''}" role="status"><b>${title}</b><p>${esc(text)}</p></div>`;
const choices=(type,items,selected,correct)=>`<div class="flow-choices">${items.map((text,i)=>`<button type="button" data-${type}="${i}" class="flow-choice ${selected===i?'chosen':''} ${selected!==null&&i===correct?'right':''}" ${selected!==null?'disabled':''}><span class="choice-letter">${'АБВ'[i]}</span><span>${esc(text)}${selected!==null&&i===correct?'<small>✓ Подходит к нашей задаче</small>':''}${selected===i&&i!==correct?'<small>Твой выбор</small>':''}</span></button>`).join('')}</div>`;
const learningNow=text=>`<div class="learning-now"><b>Сейчас учимся</b><span>${text}</span></div>`;
const formula=()=>`<section class="learning-formula"><strong>Формула понятного запроса</strong><div class="formula-row"><div class="formula-part"><b>1. Задача</b><span>Что ИИ должен сделать</span></div><div class="formula-plus">+</div><div class="formula-part"><b>2. Контекст</b><span>Что ему важно знать</span></div><div class="formula-plus">+</div><div class="formula-part"><b>3. Результат</b><span>Каким должен быть ответ</span></div></div><p class="formula-caption">Сначала увидишь эту формулу на готовом примере. Потом ответишь на три коротких вопроса — и тренажёр соберёт твой запрос.</p></section>`;
const builderProgress=field=>`<div class="builder-progress"><span class="${field===0?'active':field>0?'done':''}"><b>${field>0?'✓ ':''}Задача</b>Что нужно сделать</span><span class="${field===1?'active':field>1?'done':''}"><b>${field>1?'✓ ':''}Контекст</b>Что важно учесть</span><span class="${field===2?'active':field>2?'done':''}"><b>${field>2?'✓ ':''}Результат</b>Что должно получиться</span></div>`;
function chooseScreen(){return shell('Научись составлять понятный запрос к ИИ','За 10 минут ты разберёшь две типичные ошибки и соберёшь запрос для своей задачи.',`${formula()}<h3 class="choose-title">На какой задаче потренироваться?</h3><div class="scenario-grid">${Object.entries(scenes).map(([id,s])=>`<button type="button" class="scenario-card ${state.scene===id?'selected':''}" data-scene="${id}" aria-pressed="${state.scene===id}"><span class="scenario-icon">${s.icon}</span><strong>${s.title}</strong><span>${s.desc}</span></button>`).join('')}</div><div class="flow-actions">${button('start',state.scene?(current().round>0||current().problem!==null?'Продолжить обучение: '+esc(scene().title)+' →':'Начать обучение: '+esc(scene().title)+' →'):'Сначала выбери одну задачу')}</div><p class="flow-hint" id="choose-help">${state.scene?'Выбрано: '+esc(scene().title)+'. На следующем экране покажем готовый пример — придумывать и печатать ничего не нужно.':'Нажми на одну карточку. Выбор определит только тему примера и твоего будущего запроса.'}</p><div class="flow-roadmap"><span><b>1</b> Найдёшь, чего не хватило ИИ</span><span><b>2</b> Увидишь ответ до и после уточнения</span><span><b>3</b> Соберёшь свой запрос по той же формуле</span></div>`)}
function lessonScreen(){const s=scene(),r=current(),q=s.rounds[r.round];
 if(!q){state.stage=2;return ownScreen()}
 const context=`<div class="flow-case"><b>Наша задача</b><p>${esc(s.goal)}</p></div>`;
 if(r.phase==='problem')return shell('Почему ответ ИИ не подходит?','Сравни нашу задачу с ответом ИИ. Выбери, какой важной информации ему не хватило.',`${learningNow('Находить конкретную причину плохого ответа, а не просить ИИ просто «сделать лучше».')}<div class="round-count">Учебный пример · ошибка ${r.round+1} из 2</div>${context}${bubble('Короткий запрос к ИИ', [s.weak,...s.rounds.slice(0,r.round).map(x=>x.instruction)].join(' '))}${bubble('Что ответил ИИ',q.before)}${choices('problem',q.problems,r.problem,q.problem)}${r.problem!==null?feedback(r.problem===q.problem,r.problem===q.problem?'Верно: найдена причина.':'Правильная причина отмечена зелёным.',q.reason)+button('to-fix','Поняла. Выбрать уточнение →'):'<p class="flow-hint">Нажми на один вариант. Это тренировка: ошибиться можно, правильный ответ сразу появится.</p>'}`);
 if(r.phase==='fix')return shell('Как уточнить запрос?','Выбери фразу, которая даст ИИ именно ту информацию, которой ему не хватило.',`${learningNow('Добавлять одну полезную деталь, связанную с найденной проблемой.')}<div class="round-count">Учебный пример · исправление ${r.round+1} из 2</div>${instruction('Что нужно исправить',esc(q.problems[q.problem]))}${choices('fix',q.fixes,r.fix,q.fix)}${r.fix!==null?feedback(r.fix===q.fix,r.fix===q.fix?'Да: эта фраза решает проблему.':'Подходящая фраза отмечена зелёным.',q.why)+bubble('Вот что добавляем в запрос',q.instruction,'accent')+button('apply-fix',r.fix===q.fix?'Добавить уточнение и сравнить →':'Посмотреть, как работает правильное уточнение →'):'<p class="flow-hint">Выбирай по смыслу: хорошее уточнение исправляет найденную проблему.</p>'}${button('lesson-back','← Вернуться к ответу ИИ',true)}`);
 return shell('Что изменилось после уточнения?','Слева — прежний ответ. Справа — ответ после одной полезной детали в запросе.',`${learningNow('Проверять, какое конкретное изменение дало уточнение.')}<div class="round-count">Учебный пример · результат ${r.round+1} из 2</div><div class="flow-comparison">${bubble('До уточнения',q.before)}${bubble('После уточнения',q.after,'accent')}</div>${feedback(true,'Главный вывод',q.takeaway)}${button('round-next',r.round===0?'Закрепить на втором примере →':'Собрать свой запрос по этой формуле →')}<details class="flow-details"><summary>Показать, как выглядит учебный запрос целиком</summary><p>${esc([s.weak,...s.rounds.slice(0,r.round+1).map(x=>x.instruction)].join('\n'))}</p></details><p class="flow-disclosure">Это учебная модель ответа: она показывает связь между уточнением и результатом.</p>`)
}
function ownScreen(){const s=scene(),r=current(),f=s.fields[r.field];return shell(f[0],`Теперь собираем твой запрос. Ответь только на этот вопрос: ${f[1].charAt(0).toLowerCase()+f[1].slice(1)}`,`${builderProgress(r.field)}<div class="round-count">Твоя задача: ${esc(s.title.toLowerCase())} · вопрос ${r.field+1} из 3</div>${instruction('Что сделать сейчас','Напиши несколько слов или нажми на готовый вариант под полем.')}<label class="field-label" for="own-answer">Твой ответ</label><textarea class="flow-input" id="own-answer" rows="3" maxlength="800" placeholder="${esc(f[2][0])}" aria-describedby="own-help">${esc(r.values[r.field])}</textarea><div class="example-label">Не хочется печатать? Нажми на подходящий вариант</div><div class="flow-examples">${f[2].map((x,i)=>`<button type="button" data-example="${i}">${esc(x)}</button>`).join('')}</div><p id="own-help" class="flow-hint">Вариант сразу появится в поле. Его можно изменить своими словами.</p><div class="flow-actions">${button('field-next',r.field===2?'Собрать готовый запрос →':'Сохранить ответ →')}${button('field-back',r.field===0?'← Вернуться к учебному примеру':'← Предыдущий вопрос',true)}</div><details class="flow-details"><summary>Показать мои предыдущие ответы</summary><dl><dt>Задача</dt><dd>${esc(s.title)}</dd>${s.fields.slice(0,r.field).map((f,i)=>`<dt>${esc(f[0])}</dt><dd>${esc(r.values[i])}</dd>`).join('')}</dl></details>`)}
function finalScreen(){const submission=/^https:\/\//.test(HOMEWORK_URL);return shell('Поздравляем!<br>Домашка выполнена.','Три коротких ответа превратились в понятный запрос: ИИ видит задачу, важные детали и требования к результату.',`<div class="completion-mark" aria-hidden="true">✓</div>${builderProgress(3)}<div class="completion-skills"><span>✓ Нашла причины плохих ответов</span><span>✓ Увидела действие уточнений</span><span>✓ Собрала запрос по формуле</span></div>${submission?`<section class="submission-card"><span class="flow-eyebrow">Сдача домашки</span><h3>Осталось отправить результат</h3><p>Чтобы домашку приняли, скопируй свой запрос, перейди в форму ниже и отправь его по инструкции в форме.</p><div class="flow-actions">${button('copy','1. Скопировать мой запрос')}<a class="flow-primary" href="${esc(HOMEWORK_URL)}" target="_blank" rel="noopener">2. Отправить домашку →</a></div><p class="flow-hint">После перехода заполни и отправь форму.</p></section>`:'<p class="flow-hint">Ниже — твой готовый результат. Скопируй его: этот запрос можно сразу использовать и отправить на проверку.</p>'}<div class="flow-final"><span class="example-label">Твой готовый запрос</span><div id="result" class="flow-prompt">${esc(prompt())}</div></div>${submission?'':`<div class="flow-actions">${button('copy','Скопировать готовый запрос')}</div>`}<section class="application-card"><span class="application-eyebrow">Следующий шаг · по желанию</span><h3>Хочешь продолжить обучение?</h3><p>Если ты решила перейти к обучению, оставь заявку на курс «Новая эра ИИ». Мы расскажем о программе и условиях участия.</p><div class="application-widget" id="application-widget"><p class="application-loading">Загружаем форму заявки…</p></div><p class="application-note">Заявка на обучение — по желанию. Домашнее задание уже выполнено.</p></section><div class="flow-actions completion-secondary">${button('edit-own','Изменить мои ответы',true)}${button('another-scene','Потренироваться на другой задаче',true)}</div>`)}
function mountApplicationWidget(){const host=$('application-widget');if(!host||host.querySelector('iframe,script'))return;host.textContent='';const script=document.createElement('script');script.id=APPLICATION_WIDGET.id;script.src=APPLICATION_WIDGET.src;script.async=true;script.onload=()=>{const start=window['startWidget'+APPLICATION_WIDGET.id];if(typeof start==='function')start()};script.onerror=()=>{host.innerHTML='<p class="application-error">Форма не загрузилась. Обнови страницу и попробуй ещё раз.</p>'};host.append(script)}
function render(){const r=state.scene?current():null;document.body.classList.toggle('in-practice',state.stage>0);$('track').innerHTML=['Выбрать задачу','Разобрать 2 ошибки','Собрать свой запрос'].map((x,i)=>`<button type="button" data-nav="${i}" class="step-nav ${Math.min(state.stage,2)===i?'active':''}" ${i===1&&!r||i===2&&(!r||r.round<2)?'disabled':''} ${Math.min(state.stage,2)===i?'aria-current="step"':''}><span class="num">${i+1}</span><strong>${x}</strong></button>`).join('');$('content').innerHTML=[chooseScreen,lessonScreen,ownScreen,finalScreen][state.stage]();$('progress-fill').style.width=`${state.stage===0?0:state.stage===1?15+r.round*20:state.stage===2?60+r.field*10:100}%`;bind();if(state.stage===3)mountApplicationWidget()}
function moveFocus(){$('content').querySelector('h2')?.focus({preventScroll:true});$('main').scrollIntoView({behavior:'auto',block:'start'})}
const update=(focus=true)=>{save();render();if(focus)moveFocus()};
function start(){if(!state.scene){$('choose-help').textContent='Сначала выбери карточку задачи — например, «Написать пост».';document.querySelector('[data-scene]')?.focus();return}state.stage=current().round>=2?2:1;update()}
function fieldNext(){const r=current();if(!r.values[r.field].trim()){$('own-help').textContent='Напиши короткий ответ или нажми на один из примеров под полем.';$('own-help').setAttribute('role','alert');$('own-answer').focus();return}r.values[r.field]=r.values[r.field].trim();if(r.field<2)r.field++;else{const missing=r.values.findIndex(v=>!v.trim());if(missing>=0){r.field=missing;}else state.stage=3;}update()}
async function copy(text,id){let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch{const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch{}t.remove()}if(ok){if($(id))$(id).textContent='✓ Скопировано';toast('Твой запрос скопирован.')}else toast('Выдели текст запроса и скопируй вручную — кнопка не смогла получить доступ к буферу.')}
function bind(){const on=(id,fn)=>{if($(id))$(id).onclick=fn};
 document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{state.scene=b.dataset.scene;update(false);$('start').focus({preventScroll:true})});
 on('start',start);
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.nav);if(n>0&&!state.scene||n===2&&current().round<2)return;if(n===1&&current().round===2){current().round=1;current().phase='result';current().problem=scene().rounds[1].problem;current().fix=scene().rounds[1].fix;}state.stage=n;update()});
 document.querySelectorAll('[data-problem]').forEach(b=>b.onclick=()=>{const r=current();if(r.problem!==null)return;r.problem=Number(b.dataset.problem);update(false);$('to-fix').scrollIntoView({block:'nearest'});$('to-fix').focus({preventScroll:true})});
 on('to-fix',()=>{if(current().problem===null)return;current().phase='fix';update()});
 document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const r=current();if(r.fix!==null)return;r.fix=Number(b.dataset.fix);update(false);$('apply-fix').scrollIntoView({block:'nearest'});$('apply-fix').focus({preventScroll:true})});
 on('lesson-back',()=>{current().phase='problem';update()});on('apply-fix',()=>{if(current().fix===null)return;current().phase='result';update()});
 on('round-next',()=>{const r=current();if(r.phase!=='result'||r.round>=2)return;r.round++;r.phase='problem';r.problem=null;r.fix=null;if(r.round>=2)state.stage=2;update()});
 $('own-answer')?.addEventListener('input',e=>{current().values[current().field]=e.target.value;current().review='';save();$('own-help').textContent='Готово? Нажми синюю кнопку под примерами.'});
 document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{const r=current();r.values[r.field]=scene().fields[r.field][2][Number(b.dataset.example)];r.review='';update(false);$('field-next').focus({preventScroll:true})});
 on('field-next',fieldNext);on('field-back',()=>{const r=current();if(r.field>0)r.field--;else{state.stage=1;r.round=1;r.phase='result';r.problem=scene().rounds[1].problem;r.fix=scene().rounds[1].fix;}update()});
 on('copy',()=>copy(prompt(),'copy'));on('edit-own',()=>{current().field=0;state.stage=2;update()});on('another-scene',()=>{state.stage=0;update()});
}
save();render();

})();</script></body></html>
